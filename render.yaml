# Render Blueprint — deploys the backend API + the static web app.
# Auto-deploys on every push to the connected branch (continuous updates).
# Docs: https://render.com/docs/blueprint-spec
services:
  # ---------------- Backend API (FastAPI) ----------------
  - type: web
    name: accadde-oggi-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: MONGO_URL          # set in Render dashboard (MongoDB Atlas connection string)
        sync: false
      - key: DB_NAME
        value: accadde_oggi
      - key: JWT_SECRET
        generateValue: true     # Render generates a strong secret
      - key: ADMIN_EMAIL
        value: admin@accaddeoggi.app
      - key: ADMIN_PASSWORD
        sync: false
      - key: TEST_USER_EMAIL
        value: demo@accaddeoggi.app
      - key: TEST_USER_PASSWORD
        sync: false
      - key: GROQ_API_KEY       # optional; leave unset to use Wikipedia extracts
        sync: false
      - key: SELF_URL           # keep-alive target: stops the free instance from sleeping
        value: https://accadde-oggi-api.onrender.com
      - key: CRON_SECRET        # protects /api/cron/* — copy it into the GitHub secret
        generateValue: true
      # Google sign-in — project "Accadde Oggi" (crack-petal-504317-a9).
      #
      # These sit in the file rather than the dashboard because an OAuth client
      # ID is not a secret: it travels in the clear in every authorisation URL
      # the browser sends to Google. What actually guards the account is the
      # token check in /api/auth/google, which stays on the server.
      #
      # Keeping them here means one push configures the deploy, and the
      # published app gains the Google button without being rebuilt.
      - key: GOOGLE_WEB_CLIENT_ID
        value: 727081593792-pbs5ve4p4l7cr4ck60f3dsd8263afs16.apps.googleusercontent.com
      - key: GOOGLE_ANDROID_CLIENT_ID
        value: 727081593792-g8i94utsk023koa9ssugk57od5dkk1kc.apps.googleusercontent.com
      - key: GOOGLE_IOS_CLIENT_ID
        value: 727081593792-s1qd9u459hgcvm85v3nc0mmnqcblr8oe.apps.googleusercontent.com
      - key: FAME_MIN          # min. Wikipedia editions for a person to earn a card
        value: "30"

  # ---------------- Web app (Expo static export) ----------------
  - type: web
    name: accadde-oggi-web
    runtime: static
    rootDir: frontend
    buildCommand: yarn install --frozen-lockfile && npx expo export -p web
    staticPublishPath: dist
    envVars:
      # Matches the API service public URL (Render derives it from the service name).
      # If you rename the API service, update this value to match.
      - key: EXPO_PUBLIC_BACKEND_URL
        value: https://accadde-oggi-api.onrender.com
      # Fallback for the web build if the API is ever unreachable at load time.
      # The app normally asks the API for this at runtime.
      - key: EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
        value: 727081593792-pbs5ve4p4l7cr4ck60f3dsd8263afs16.apps.googleusercontent.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
